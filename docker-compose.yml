services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        GHCR_REGISTRY: ${GHCR_REGISTRY:-ghcr.io/}
        APT_MIRROR: ${APT_MIRROR:-}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-}
    container_name: banana-slides-backend
    ports:
      # Cổng máy chủ:Cổng nội bộ container
      # Cổng máy chủ được điều khiển bởi BACKEND_PORT, cổng nội bộ container cố định là 5000
      - "${BACKEND_PORT:-5011}:5000"
      # OpenAI OAuth callback server
      - "1455:1455"
    # Tự động nạp tất cả biến môi trường từ tệp .env
    env_file:
      - .env
    # Uncomment below to use Vertex AI with a GCP service-account key
    # environment:
    #   - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-sa-key.json
    volumes:
      # Lưu trữ bền vững cơ sở dữ liệu
      - ./backend/instance:/app/backend/instance
      # Lưu trữ bền vững các tệp tải lên
      - ./uploads:/app/uploads
      # Mount GCP service-account key (Vertex AI only — uncomment if needed)
      # - ./gcp-service-account.json:/app/gcp-sa-key.json:ro
    restart: unless-stopped
    healthcheck:
      # Kiểm tra trạng thái hoạt động sử dụng cổng nội bộ cố định 5000 của container
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - banana-slides-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Tương thích Windows: tắt theo dõi liên kết tượng trưng + tham số dựng frontend
      args:
        DOCKER_BUILDKIT: 1
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: banana-slides-frontend
    ports:
      - "${FRONTEND_PORT:-3011}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - banana-slides-network

networks:
  banana-slides-network:
    driver: bridge

volumes:
  backend-data:
  uploads-data:
