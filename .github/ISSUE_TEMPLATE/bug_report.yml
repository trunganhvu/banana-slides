name: Báo cáo lỗi / Bug Report
description: Báo cáo lỗi hoặc sự cố / Report a bug or issue
labels: ["bug"]
body:
  - type: dropdown
    id: deployment
    attributes:
      label: Phương thức triển khai / Deployment Method
      description: Bạn gặp sự cố này ở môi trường nào? / Where did you encounter this issue?
      options:
        - Demo Website (bananaslides.online)
        - Docker Compose (docker-compose.yml)
        - Docker Compose with Pre-built Images (docker-compose.prod.yml)
        - Phát triển cục bộ / Local Development (uv + npm)
        - Nền tảng Cloud / Cloud Platform
        - Khác / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Mô tả sự cố / Issue Description
      description: Mô tả chi tiết vấn đề bạn gặp phải / Describe the issue you encountered
      placeholder: Chuyện gì đã xảy ra? / What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện / Steps to Reproduce
      description: Làm thế nào để tái hiện lỗi này? / How can we reproduce this issue?
      placeholder: |
        1. Truy cập vào... / Go to...
        2. Nhấp vào... / Click on...
        3. Xuất hiện lỗi / See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Kết quả kỳ vọng / Expected Behavior
      description: Bạn mong đợi kết quả như thế nào? / What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Nhật ký lỗi / Logs
      description: Dán nhật ký liên quan (docker logs, console trình duyệt, v.v.) / Paste relevant logs
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Phiên bản / Version
      description: Bạn đang sử dụng phiên bản nào? / Which version are you using?
      placeholder: v0.4.0 hoặc commit hash / v0.4.0 or commit hash
    validations:
      required: false
