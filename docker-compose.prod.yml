# Tệp cấu hình này dùng để kéo trực tiếp các image đã được dựng sẵn trên Docker Hub

services:
  backend:
    # Sử dụng image backend dựng sẵn
    image: ${DOCKER_IMAGE_BACKEND:-anoinex/banana-slides-backend:latest}
    container_name: banana-slides-backend
    ports:
      # Cổng máy chủ:Cổng nội bộ container
      # Cổng máy chủ được điều khiển bởi BACKEND_PORT, cổng nội bộ container cố định là 5000
      - "${BACKEND_PORT:-5011}:5000"
      # OpenAI OAuth callback server
      - "1455:1455"
    # Tự động nạp tất cả biến môi trường từ tệp .env
    env_file:
      - .env
    # Cấu hình Vertex AI (bỏ ghi chú bên dưới khi sử dụng Vertex AI)
    # environment:
    #   - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-service-account.json
    volumes:
      # Lưu trữ bền vững cơ sở dữ liệu
      - ./backend/instance:/app/backend/instance
      # Lưu trữ bền vững các tệp tải lên
      - ./uploads:/app/uploads
      # Tệp tài khoản dịch vụ GCP (chỉ người dùng Vertex AI mới cần bỏ ghi chú dòng tiếp theo)
      # - ./gcp-service-account.json:/app/gcp-service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - banana-slides-network

  frontend:
    # Sử dụng image frontend dựng sẵn
    image: ${DOCKER_IMAGE_FRONTEND:-anoinex/banana-slides-frontend:latest}
    container_name: banana-slides-frontend
    ports:
      - "${FRONTEND_PORT:-3011}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - banana-slides-network

networks:
  banana-slides-network:
    driver: bridge

volumes:
  backend-data:
  uploads-data:
