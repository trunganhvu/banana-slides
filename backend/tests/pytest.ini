[pytest]
# File cau hinh pytest

# Mau khop file test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Thu muc test
testpaths = tests

# Tuy chon output
addopts = 
    -v
    --strict-markers
    --tb=short
    -p no:warnings

# Dinh nghia marker
markers =
    unit: Kiem thu don vi
    integration: Kiem thu tich hop
    e2e: Kiem thu dau-cuoi E2E
    slow: Kiem thu cham (can goi API thuc te)
    mock: Kiem thu su dung mock
    docker: Kiem thu trong moi truong Docker
    requires_service: Yeu cau backend dang chay thuc te (chay trong docker-test)

# Cau hinh coverage
[coverage:run]
source = .
omit = 
    tests/*
    */__init__.py
    venv/*
    .venv/*
